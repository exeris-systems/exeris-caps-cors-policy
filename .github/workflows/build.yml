name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the release-bearing row — the LTS this cap compiles at and the floor
        # its jar must be loadable from. 26 is forward-compatibility: it catches source
        # that stops compiling on a newer JDK. Both rows produce class-file major 69,
        # because `release` fixes the stamp regardless of the building JDK.
        java: ['25', '26']

    steps:
      - name: Checkout exeris-caps-cors-policy
        uses: actions/checkout@v7
        with:
          path: exeris-caps-cors-policy

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Two passes, and the first one is not redundant. exeris:generate runs at
      # generate-sources, but the processor only writes capability metadata during
      # compile — so on a fresh checkout the first pass has nothing to read. Seeding
      # with codegen skipped produces the metadata; the second pass consumes it and
      # emits cap-manifest.json.
      - name: Seed capability metadata (first pass, codegen skipped)
        working-directory: exeris-caps-cors-policy
        run: mvn -B -ntp compile -Dexeris.codegen.skip=true

      - name: mvn verify (second pass — generates, validates, scans the Wall)
        working-directory: exeris-caps-cors-policy
        run: mvn -B -ntp verify

      # The manifest is the artefact this whole pipeline exists to produce. Failing
      # loudly when it is absent or unstamped beats a green build that silently emitted
      # nothing — "the goal ran" and "the goal produced a valid stamp" are different
      # claims, and only the second one matters to a SKU.
      - name: Assert the cap manifest was emitted and stamped
        working-directory: exeris-caps-cors-policy
        run: |
          MANIFEST=$(find . -name cap-manifest.json -print -quit)
          if [ -z "$MANIFEST" ]; then
            echo "::error::no cap-manifest.json was emitted — the capability pass did not run"
            exit 1
          fi
          echo "found: $MANIFEST"
          cat "$MANIFEST"
          python3 - "$MANIFEST" <<'PY'
          import json, re, sys
          m = json.load(open(sys.argv[1]))
          stamp = m.get("stamp") or {}
          assert m.get("schemaVersion") == 2, f"unexpected schemaVersion: {m.get('schemaVersion')}"
          assert stamp.get("validated") is True, "stamp is not validated"
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", stamp.get("contentBinding") or ""), \
              f"bad contentBinding: {stamp.get('contentBinding')!r}"
          names = [mod.get("qualifiedName") for mod in m.get("modules") or []]
          assert "eu.exeris.caps.corspolicy.CorsPolicyModule" in names, \
              f"module missing from manifest: {names}"
          print("manifest OK — validated stamp, sha256 binding, module present")
          PY

      # "The manifest is valid" and "the manifest is the one in the repo" are different
      # claims, and until now only the first was checked. `exeris:generate` writes into
      # src/, not target/, and that file is committed — so a build whose output drifts from
      # the committed copy leaves a repo where the declaration and the artefact a SKU
      # consumes disagree, silently, with CI green.
      #
      # The gap is not theoretical: the codegen chain is driven by maven-compiler-plugin's
      # annotationProcessorPaths, so a routine plugin bump is exactly the change that could
      # move the emitted metadata with nothing on the pull request to notice it.
      #
      # AGENTS.md and CONTRIBUTING.md both tell a contributor to check `git status` after a
      # build. This is that instruction, enforced rather than requested.
      #
      # `git status --porcelain`, not `git diff --exit-code`: a plain diff reports only
      # tracked files, so a codegen version that starts emitting an ADDITIONAL file under
      # src/main/generated/ would leave the working tree out of step with the repo and this
      # gate would still pass. `--untracked-files=all` is what makes a new file inside an
      # existing directory visible rather than collapsed into the directory name.
      - name: Assert the committed manifest matches what this build regenerated
        working-directory: exeris-caps-cors-policy
        run: |
          DRIFT=$(git status --porcelain --untracked-files=all -- src/main/generated/)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            git diff -- src/main/generated/ || true
            echo "::error::src/main/generated/ does not match what this build produced — run the two-pass build locally and commit the result"
            exit 1
          fi
          echo "committed generated tree matches this build's output"
