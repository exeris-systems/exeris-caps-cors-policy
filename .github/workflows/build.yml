name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the release-bearing row — the LTS this cap compiles at and the floor
        # its jar must be loadable from. 26 is forward-compatibility: it catches source
        # that stops compiling on a newer JDK. Both rows produce class-file major 69,
        # because `release` fixes the stamp regardless of the building JDK.
        java: ['25', '26']

    steps:
      - name: Checkout exeris-caps-cors-policy
        uses: actions/checkout@v4
        with:
          path: exeris-caps-cors-policy

      # eu.exeris artifacts are not on Maven Central yet (deliberate — the SDK does not
      # move before the kernel does), so both upstreams are built from source. The SDK
      # is pinned to an immutable release tag rather than a moving branch: a moving ref
      # lets an unrelated upstream commit turn this build red.
      - name: Checkout exeris-sdk (v0.10.0 — matches exeris.sdk.version in the POM)
        uses: actions/checkout@v4
        with:
          repository: exeris-systems/exeris-sdk
          ref: v0.10.0
          path: exeris-sdk

      # Tracks main because the codegen plugin has no release carrying what this cap
      # needs; 0.7.0-SNAPSHOT is main. Pin this to a tag as soon as one exists.
      - name: Checkout exeris-tooling (0.7.0-SNAPSHOT — no release yet)
        uses: actions/checkout@v4
        with:
          repository: exeris-systems/exeris-tooling
          ref: main
          path: exeris-tooling

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # japicmp.skip mirrors what the SDK's own CI passes, and it is required from
      # v0.10.0 on: that release bound a semver-gate japicmp execution to `verify`,
      # which `install` runs. The gate resolves the previous release jar as its
      # baseline, and eu.exeris is not on Central, so a runner has nothing to resolve —
      # and an absent baseline is configured to FAIL. That is the correct posture for
      # the SDK and simply not this repo's gate to run.
      - name: Install exeris-sdk to the local repo
        working-directory: exeris-sdk
        run: mvn -B -ntp -DskipTests -Djapicmp.skip=true install

      # Exclude the kernel-demanding module and the coverage reporter that folds it in.
      # This is not an optimisation — it is what keeps this build credential-free. tooling's
      # exeris-e2e-tests declares exeris-kernel-{spi,core,community,community-testkit} at
      # test scope; those live on GitHub Packages and would demand a token.
      #
      # Three traps, all hit for real before this line settled:
      #
      # -DskipTests is NOT sufficient. Maven collects a module's dependency graph regardless
      # of whether its tests compile, so the kernel is still demanded and the build still
      # 401s. The module has to leave the reactor, not merely go quiet.
      #
      # An allowlist (-pl exeris-processor,exeris-codegen-maven-plugin -am) is NOT sufficient
      # either. It omits exeris-tooling-bom, which exeris-tooling-parent imports in
      # dependencyManagement — and -am does not traverse BOM imports. The plugin then fails
      # to resolve against a clean repo, which is what CI has and a dev machine usually is not.
      #
      # exeris-coverage-aggregate has to go too: it declares exeris-e2e-tests at provided
      # scope to locate its jacoco.exec, so dropping e2e-tests alone leaves it unresolvable.
      # It is a reporting module (packaging: pom) that produces nothing a consumer consumes.
      #
      # Tooling's own CI is what runs tooling's tests and publishes its coverage.
      - name: Install the codegen chain to the local repo (kernel-free reactor)
        working-directory: exeris-tooling
        run: mvn -B -ntp -DskipTests install -pl '!exeris-e2e-tests,!exeris-coverage-aggregate'

      # Two passes, and the first one is not redundant. exeris:generate runs at
      # generate-sources, but the processor only writes capability metadata during
      # compile — so on a fresh checkout the first pass has nothing to read. Seeding
      # with codegen skipped produces the metadata; the second pass consumes it and
      # emits cap-manifest.json.
      - name: Seed capability metadata (first pass, codegen skipped)
        working-directory: exeris-caps-cors-policy
        run: mvn -B -ntp compile -Dexeris.codegen.skip=true

      - name: mvn verify (second pass — generates, validates, scans the Wall)
        working-directory: exeris-caps-cors-policy
        run: mvn -B -ntp verify

      # The manifest is the artefact this whole pipeline exists to produce. Failing
      # loudly when it is absent or unstamped beats a green build that silently emitted
      # nothing — "the goal ran" and "the goal produced a valid stamp" are different
      # claims, and only the second one matters to a SKU.
      - name: Assert the cap manifest was emitted and stamped
        working-directory: exeris-caps-cors-policy
        run: |
          MANIFEST=$(find . -name cap-manifest.json -print -quit)
          if [ -z "$MANIFEST" ]; then
            echo "::error::no cap-manifest.json was emitted — the capability pass did not run"
            exit 1
          fi
          echo "found: $MANIFEST"
          cat "$MANIFEST"
          python3 - "$MANIFEST" <<'PY'
          import json, re, sys
          m = json.load(open(sys.argv[1]))
          stamp = m.get("stamp") or {}
          assert m.get("schemaVersion") == 2, f"unexpected schemaVersion: {m.get('schemaVersion')}"
          assert stamp.get("validated") is True, "stamp is not validated"
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", stamp.get("contentBinding") or ""), \
              f"bad contentBinding: {stamp.get('contentBinding')!r}"
          names = [mod.get("qualifiedName") for mod in m.get("modules") or []]
          assert "eu.exeris.caps.corspolicy.CorsPolicyModule" in names, \
              f"module missing from manifest: {names}"
          print("manifest OK — validated stamp, sha256 binding, module present")
          PY
